# Define the version of the configuration file
version: "0.2"
autosplit: true

# Set the concurrency level for test execution (3 devices in parallel)
concurrency: 3

env:
  DETOX: true

framework:
    # Name of the test framework (raw in this case)
    name: raw
    args:
        buildName: LT-Detox-Sample-Parallel
        deviceLogs: true
        devices:
            - .*-.*
            - .*-.*
            - .*-.*
        disableReleaseDevice: true
        isRealMobile: true
        mobileDC: true
        platformName: android
        queueTimeout: 600
        video: true

# Make test status as HyperExecute job's status
frameworkStatusOnly: true


cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
    - .npm

# Pre-install required dependencies from pre-setup scripts
pre:
    - bash ./lambdatest/scripts/pre-setup-ad.sh

# Specify the target platform for test execution (Android in this case)
runson: android

# Test discovery configuration
testDiscovery:
    # Command to discover tests from the discoveryParallel.txt file
    command: cat ./lambdatest/discoveryParallel.txt
    # Test discovery mode is static
    mode: static
    # Test type is raw (custom test implementation)
    type: raw

# Command to run the tests using the testRunnerCommand
testRunnerCommand: npm run $test

report: true
partialReports:
    location: reports/
    type: html


# job label for hyperexecute job
jobLabel: ['raw','detox','parallel']
